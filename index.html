<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>JavaPath — MouriTech Java Training Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="dashboard" aria-label="JavaPath home">
        <span class="brand-mark">J<span>+</span></span><span>JavaPath</span>
      </a>
      <div class="sidebar-label">LEARN</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">▦</span>Dashboard</button>
        <button class="nav-item" data-page="roadmap"><span class="nav-icon">⌁</span>Learning Roadmap</button>
        <button class="nav-item" data-page="topics"><span class="nav-icon">▤</span>All Topics <span class="nav-count" id="topic-count">0</span></button>
        <button class="nav-item" data-page="flashcards"><span class="nav-icon">▣</span>Flashcards</button>
      </nav>
      <div class="sidebar-label second-label">PRACTICE</div>
      <nav class="nav-list" aria-label="Practice navigation">
        <button class="nav-item" data-page="assessments"><span class="nav-icon">✎</span>Assessments</button>
        <button class="nav-item" data-page="playground"><span class="nav-icon">⌘</span>Code Playground</button>
        <button class="nav-item" data-page="assignments"><span class="nav-icon">📋</span>Assignments</button>
      </nav>
      <div class="sidebar-label second-label">REVIEW</div>
      <nav class="nav-list" aria-label="Review navigation">
        <button class="nav-item" data-page="review"><span class="nav-icon">↻</span>Review Mistakes</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="streak-card"><div class="streak-icon">✦</div><div><strong>Small steps add up.</strong><p>Learn a little Java every day.</p></div></div>
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
        <div class="profile"><div class="avatar">JP</div><div><strong>JavaPath</strong><small>Java Academy</small></div></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
        <div class="breadcrumbs"><span>JavaPath</span><span class="crumb-slash">/</span><strong id="crumb-current">Dashboard</strong></div>
        <div class="top-actions">
          <label class="search-box"><span>⌕</span><input id="global-search" type="search" placeholder="Search Java concepts..." autocomplete="off"><kbd>⌘ K</kbd></label>
          <button class="icon-button" id="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle theme">☼</button>
        </div>
      </header>
      <section id="search-results" class="search-results hidden"></section>
      <div class="page-content" id="page-content" tabindex="-1"></div>
      <footer class="footer"><span>JavaPath</span><span>Java 17 Baseline · Training Academy</span></footer>
    </main>
  </div>
  <!-- Data files -->
  <script src="data/topics-phase1.js"></script>
  <script src="data/topics-phase2.js"></script>
  <script src="data/topics-phase3.js"></script>
  <script src="data/topics-phase4.js"></script>
  <script src="data/topics-phase5.js"></script>
  <script src="data/topics-phase6-7.js"></script>
  <script src="data/assessments.js"></script>
  <script src="data/flashcards.js"></script>
  <script src="data/assignments.js"></script>
  <!-- Application -->
  <script src="js/app.js"></script>
</body>
</html>
